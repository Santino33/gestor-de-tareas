<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1A1A1A">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <main class="app">
    <h1>Gestor de tareas</h1>
    <p class="subtitle">Tus tareas y notas privadas, incluso sin conexión.</p>

    <form id="password-form" class="password-form" hidden>
      <label for="password-input" id="password-label">Contraseña de las notas privadas</label>
      <input type="password" id="password-input" autocomplete="current-password" required minlength="1">
      <label for="password-confirm" id="confirm-label" hidden>Repite la contraseña</label>
      <input type="password" id="password-confirm" autocomplete="new-password" hidden>
      <button type="submit" id="password-submit">Desbloquear</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>

    <section id="task-section" hidden>
    <form id="task-form" class="task-form">
      <input type="text" id="title-input" placeholder="Nueva tarea…" required>
      <select id="priority-select">
        <option value="low">Baja</option>
        <option value="medium" selected>Media</option>
        <option value="high">Alta</option>
      </select>
      <label for="note-input" class="note-label">Nota privada (opcional)</label>
      <textarea id="note-input" placeholder="Solo se mostrará al abrir esta tarea…"></textarea>
      <button type="submit">Agregar</button>
    </form>

    <div class="task-filters">
      <label for="priority-filter">Filtrar por prioridad</label>
      <select id="priority-filter">
        <option value="">Todas</option>
        <option value="low">Baja</option>
        <option value="medium">Media</option>
        <option value="high">Alta</option>
      </select>
      <button id="complete-priority" type="button" disabled>Completar esta prioridad</button>
      <p>Ordenadas por fecha de creación, de más antigua a más reciente.</p>
    </div>
    <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
